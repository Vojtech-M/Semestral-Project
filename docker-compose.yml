version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: robosoutez_db
    environment:
      POSTGRES_DB: robosoutez
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: heslo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: robosoutez_app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/robosoutez
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=heslo
    depends_on:
      - postgres

volumes:
  pgdata: