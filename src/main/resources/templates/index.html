<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Robosoutěž - Přihláška</title>
    <style>
        :root {
            --primary: #c1121f;
            --primary-dark: #8f0d17;
            --bg: #f4f4f9;
            --card-bg: #ffffff;
            --text: #1b2330;
            --border: #d5dbe4;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1, h2 {
            color: var(--primary);
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
        }
        button {
            background-color: var(--primary);
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: var(--primary-dark);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        th {
            background-color: var(--primary);
            color: white;
        }
        tr:last-child td {
            border-bottom: none;
        }
        .box {
            text-align: center;
            font-size: 14px;
            color: #666;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 th:text="${nazev}">ROBOSOUTĚŽ</h1>
    <p>Vyplňte formulář pro registraci školy a týmu.</p>

    <form th:object="${registrationForm}" method="post">
        <input type="text" th:field="*{schoolName}" placeholder="Název školy" required />
        <input type="text" th:field="*{schoolAddress}" placeholder="Adresa školy" required />
        <input type="text" th:field="*{schoolCity}" placeholder="Město" required />
        <input type="text" th:field="*{schoolZip}" placeholder="PSČ" required />
        <input type="text" th:field="*{schoolWeb}" placeholder="Web" />
        <input type="text" th:field="*{teamName}" placeholder="Název týmu" required />
        <button type="submit">Odeslat přihlášku</button>
    </form>
</div>

<div class="container" style="max-width: 800px;">
    <h2>Přihlášené týmy</h2>
    <table>
        <thead>
            <tr>
                <th>Škola</th>
                <th>Tým</th>
                <th>Město</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="reg : ${registrations}">
                <td th:text="${reg.schoolName}">Škola</td>
                <td th:text="${reg.teamName}">Tým</td>
                <td th:text="${reg.schoolCity}">Město</td>
            </tr>
            <tr th:if="${#lists.isEmpty(registrations)}">
                <td colspan="3" style="text-align: center; color: #777;">Zatím nejsou evidovány žádné přihlášky.</td>
            </tr>
        </tbody>
    </table>
</div>

<div class="box">
    <p>Technické demo běžící v Javě 21 uvnitř Dockeru · Připojeno k databázi</p>
</div>

</body>
</html>
