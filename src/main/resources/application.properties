spring.datasource.url=jdbc:h2:file:./data/robosoutez;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# If using JPA/Hibernate, H2 generates a dialect automatically, but you can specify it if needed:
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Optional: H2 Console access in development
spring.h2.console.enabled=true